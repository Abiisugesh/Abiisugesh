<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="55%" stop-color="#0b0f0c"/>
      <stop offset="100%" stop-color="#020402"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="fireflyGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="moon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9dffb0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#9dffb0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <circle cx="600" cy="60" r="90" fill="url(#moon)"/>

  <!-- ===== LEFT CORNER WEB (faint, background layer) ===== -->
  <g stroke="#3ddc84" stroke-opacity="0.28" stroke-width="1">
    <line x1="0" y1="0" x2="250" y2="0"/>
    <line x1="0" y1="0" x2="241.5" y2="64.7"/>
    <line x1="0" y1="0" x2="216.5" y2="125"/>
    <line x1="0" y1="0" x2="176.75" y2="176.75"/>
    <line x1="0" y1="0" x2="125" y2="216.5"/>
    <line x1="0" y1="0" x2="64.7" y2="241.5"/>
    <line x1="0" y1="0" x2="0" y2="250"/>
    <polyline fill="none" points="100,0 96.6,25.9 86.6,50 70.7,70.7 50,86.6 25.9,96.6 0,100"/>
    <polyline fill="none" points="200,0 193.2,51.8 173.2,100 141.4,141.4 100,173.2 51.8,193.2 0,200"/>
  </g>

  <!-- ===== RIGHT CORNER WEB (faint, background layer) ===== -->
  <g stroke="#3ddc84" stroke-opacity="0.28" stroke-width="1">
    <line x1="1200" y1="0" x2="950" y2="0"/>
    <line x1="1200" y1="0" x2="958.5" y2="64.7"/>
    <line x1="1200" y1="0" x2="983.5" y2="125"/>
    <line x1="1200" y1="0" x2="1023.25" y2="176.75"/>
    <line x1="1200" y1="0" x2="1075" y2="216.5"/>
    <line x1="1200" y1="0" x2="1135.3" y2="241.5"/>
    <line x1="1200" y1="0" x2="1200" y2="250"/>
    <polyline fill="none" points="1100,0 1103.4,25.9 1113.4,50 1129.3,70.7 1150,86.6 1174.1,96.6 1200,100"/>
    <polyline fill="none" points="1000,0 1006.8,51.8 1026.8,100 1058.6,141.4 1100,173.2 1148.2,193.2 1200,200"/>
  </g>

  <!-- ===== FIREFLIES ===== -->
  <g filter="url(#fireflyGlow)">
    <!-- each firefly: a drifting dot with its own loose wander path + flicker -->
    <circle r="2.6" fill="#c8ffb0">
      <animateMotion path="M 90,220 q 40,-60 10,-110 q -30,-50 20,-90" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.15;1;0.2;0.9;0.15" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="2.2" fill="#9dffc8">
      <animateMotion path="M 260,60 q -30,50 20,90 q 40,40 -10,100" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.1;0.8;0.15" dur="2.7s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#d4ff9d">
      <animateMotion path="M 420,240 q 50,-70 0,-130 q -40,-50 30,-80" dur="13s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;1;0.3;0.85;0.2" dur="4.1s" repeatCount="indefinite"/>
    </circle>
    <circle r="2" fill="#c8ffb0">
      <animateMotion path="M 560,90 q -40,60 10,110 q 30,40 -20,90" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.1;0.9;0.2;1;0.1" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle r="2.8" fill="#9dffc8">
      <animateMotion path="M 700,210 q 30,-50 -10,-100 q -40,-40 20,-90" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.2;1;0.15" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <circle r="2.3" fill="#d4ff9d">
      <animateMotion path="M 830,50 q -30,60 20,100 q 30,50 -30,110" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;1;0.3;0.9;0.2" dur="3.3s" repeatCount="indefinite"/>
    </circle>
    <circle r="2.6" fill="#c8ffb0">
      <animateMotion path="M 970,230 q 40,-60 -10,-120 q -30,-40 30,-80" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.15;0.85;0.2;1;0.15" dur="4.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="2" fill="#9dffc8">
      <animateMotion path="M 1100,70 q -30,50 10,100 q 30,50 -20,90" dur="9.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.15;0.8;0.2" dur="2.9s" repeatCount="indefinite"/>
    </circle>
    <circle r="1.8" fill="#d4ff9d">
      <animateMotion path="M 40,90 q 30,60 -10,110 q -20,40 30,80" dur="10.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.9;0.15;1;0.2" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <circle r="2.4" fill="#c8ffb0">
      <animateMotion path="M 1150,180 q -40,-50 0,-100 q 30,-40 -20,-80" dur="11.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.2;1;0.15" dur="3.1s" repeatCount="indefinite"/>
    </circle>
    <circle r="2.2" fill="#9dffc8">
      <animateMotion path="M 340,150 q 40,60 -10,110 q -30,30 30,60" dur="12.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;1;0.3;0.85;0.2" dur="3.9s" repeatCount="indefinite"/>
    </circle>
    <circle r="2.7" fill="#d4ff9d">
      <animateMotion path="M 780,150 q -50,-60 0,-110 q 40,-30 -20,-70" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.1;0.9;0.2;1;0.1" dur="3.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ===== SMALL CRAWLING SPIDER (kept subtle, top-left web) ===== -->
  <g filter="url(#softGlow)" opacity="0.85">
    <g id="spider">
      <ellipse cx="0" cy="0" rx="6" ry="8" fill="#0a0a0a" stroke="#3ddc84" stroke-width="1"/>
      <circle cx="0" cy="-8" r="3.4" fill="#0a0a0a" stroke="#3ddc84" stroke-width="1"/>
      <g stroke="#3ddc84" stroke-width="1" fill="none">
        <path d="M -5,-3 Q -12,-5 -15,-2"/>
        <path d="M -5,2 Q -13,4 -16,7"/>
        <path d="M 5,-3 Q 12,-5 15,-2"/>
        <path d="M 5,2 Q 13,4 16,7"/>
      </g>
    </g>
    <animateMotion dur="10s" repeatCount="indefinite"
      path="M 0,0 L 200,0 L 100,173.2 L 0,250 L 0,0" rotate="auto"/>
  </g>

  <!-- ===== TITLE ===== -->
  <text x="600" y="150" text-anchor="middle" font-family="'Courier New', monospace" font-size="46"
        fill="#eafff0" filter="url(#glow)" letter-spacing="4">ABIISUGESH</text>
  <text x="600" y="182" text-anchor="middle" font-family="'Courier New', monospace" font-size="15"
        fill="#3ddc84" letter-spacing="2" opacity="0.9">// caught somewhere between code and fireflies</text>
</svg>
