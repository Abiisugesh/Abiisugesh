<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Abi Sugesh - Full-Stack Developer</title>
  <desc id="desc">Animated dark navy and electric cyan developer profile banner, with a code editor illustration and soft ambient motion.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#091322"/>
      <stop offset="55%" stop-color="#0B1729"/>
      <stop offset="100%" stop-color="#101B33"/>
    </linearGradient>
    <linearGradient id="electric" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="54%" stop-color="#6DDFFF"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="45%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetglow">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dotgrid" width="25" height="25" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#77B4E0" fill-opacity="0.16"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="17"/></filter>
    <clipPath id="crop"><rect x="0" y="0" width="1200" height="360" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#crop)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#dotgrid)"/>
    <circle cx="160" cy="20" r="275" fill="url(#glow)">
      <animate attributeName="opacity" values="0.65;1;0.65" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1000" cy="340" r="330" fill="url(#violetglow)">
      <animate attributeName="opacity" values="1;0.5;1" dur="9s" repeatCount="indefinite"/>
    </circle>
    <path d="M-75 320 C220 200 355 423 726 235 S1120 120 1320 260" fill="none" stroke="#38BDF8" stroke-opacity="0.09" stroke-width="2"/>
    <path d="M-95 343 C220 223 350 446 735 261 S1130 144 1310 280" fill="none" stroke="#8B5CF6" stroke-opacity="0.09" stroke-width="1.5"/>
    <path d="M-30 338 H1230" stroke="url(#horizon)" stroke-width="2"/>
    <path d="M74 47 H660" stroke="#2C4964" stroke-opacity="0.75"/>
    <path d="M74 47 H240" stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="90 270">
      <animate attributeName="stroke-dashoffset" from="360" to="0" dur="7s" repeatCount="indefinite"/>
    </path>
    <g fill="#38BDF8">
      <circle cx="685" cy="38" r="2.6"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="698" cy="65" r="1.8"><animate attributeName="opacity" values="1;0.2;1" dur="3.9s" repeatCount="indefinite"/></circle>
      <circle cx="1180" cy="27" r="2"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="4.5s" repeatCount="indefinite"/></circle>
      <circle cx="1175" cy="331" r="2.1"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/></circle>
    </g>
    <g font-family="Segoe UI, Arial, sans-serif">
      <rect x="74" y="70" width="33" height="28" rx="7" fill="#12334B" stroke="#246583" stroke-opacity="0.8"/>
      <text x="81" y="89" fill="#38BDF8" font-size="16" font-weight="700">&lt;/&gt;</text>
      <text x="123" y="89" fill="#85BFD9" letter-spacing="3" font-size="14" font-weight="700">HELLO, WORLD.</text>
      <text x="72" y="166" font-size="69" letter-spacing="-1" font-weight="800" fill="#EDF7FE">ABI</text>
      <text x="211" y="166" font-size="69" letter-spacing="-1" font-weight="800" fill="url(#electric)">SUGESH</text>
      <rect x="75" y="182" width="375" height="2.5" rx="1.25" fill="url(#electric)" opacity="0.76"/>
      <text x="75" y="221" font-size="23" font-weight="650" letter-spacing="3" fill="#CDEDFC">FULL-STACK DEVELOPER</text>
      <text x="75" y="256" font-size="17" fill="#9CB4C8">Java / Spring Boot / React / Next.js</text>
      <rect x="75" y="283" width="256" height="38" rx="19" fill="#0C2831" stroke="#1E636D" stroke-opacity="0.9"/>
      <circle cx="96" cy="302" r="5" fill="#4ADE80">
        <animate attributeName="opacity" values="1;0.3;1" dur="2.5s" repeatCount="indefinite"/>
      </circle>
      <text x="111" y="307" fill="#B9EAD7" font-size="12" font-weight="700" letter-spacing="1.2">OPEN TO COLLABORATION</text>
    </g>
    <g>
      <rect x="748" y="55" width="414" height="252" rx="15" fill="#07101E" fill-opacity="0.72" stroke="#2D5770" stroke-opacity="0.8"/>
      <rect x="748" y="55" width="414" height="43" rx="15" fill="#14263B"/>
      <rect x="748" y="85" width="414" height="13" fill="#14263B"/>
      <path d="M749 98 H1161" stroke="#2D5770" stroke-opacity="0.7"/>
      <circle cx="771" cy="77" r="5" fill="#FB7185"/>
      <circle cx="789" cy="77" r="5" fill="#FBBF24"/>
      <circle cx="807" cy="77" r="5" fill="#4ADE80"/>
      <text x="948" y="82" fill="#7190AD" font-size="12" font-family="monospace" text-anchor="middle">developer.ts</text>
      <g font-family="Consolas, Menlo, monospace" font-size="17">
        <text x="777" y="136" fill="#B1C7DB">01</text>
        <text x="821" y="136"><tspan fill="#C084FC">const</tspan> <tspan fill="#A7E2FF">developer</tspan> <tspan fill="#CBD5E1">= {</tspan></text>
        <text x="777" y="170" fill="#5C7592">02</text>
        <text x="843" y="170"><tspan fill="#9CB4C8">name:</tspan> <tspan fill="#86EFAC">"Abi Sugesh"</tspan><tspan fill="#CBD5E1">,</tspan></text>
        <text x="777" y="204" fill="#5C7592">03</text>
        <text x="843" y="204"><tspan fill="#9CB4C8">stack:</tspan> <tspan fill="#86EFAC">"Full Stack"</tspan><tspan fill="#CBD5E1">,</tspan></text>
        <text x="777" y="238" fill="#5C7592">04</text>
        <text x="843" y="238"><tspan fill="#9CB4C8">mode:</tspan> <tspan fill="#86EFAC">"Build &amp; Ship"</tspan></text>
        <text x="777" y="272" fill="#5C7592">05</text>
        <text x="821" y="272" fill="#CBD5E1">};</text>
        <rect x="846" y="256" width="8" height="20" fill="#38BDF8">
          <animate attributeName="opacity" values="1;0;1" keyTimes="0;0.5;1" dur="1.2s" repeatCount="indefinite"/>
        </rect>
      </g>
      <path d="M747 292 H1164" stroke="url(#electric)" stroke-width="2.5" stroke-dasharray="52 365">
        <animate attributeName="stroke-dashoffset" from="420" to="0" dur="8s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>
</svg>
